  <rect class="cell-pad" x="2227.4" y="890.4" width="19.6" height="30.8"/>
  <text class="dim" x="2263.8" y="910.8" text-anchor="middle" font-size="15">&#8230;</text>
  <rect class="cell-real" x="2276.4" y="890.4" width="19.6" height="30.8" rx="2.8"/>
  <rect class="cell-real" x="2300.2" y="890.4" width="19.6" height="30.8" rx="2.8"/>
  <rect class="cell-real" x="2324.0" y="890.4" width="19.6" height="30.8" rx="2.8"/>
  <rect class="cell-real" x="2347.8" y="890.4" width="19.6" height="30.8" rx="2.8"/>
