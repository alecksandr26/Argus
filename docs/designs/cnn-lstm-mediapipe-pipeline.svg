<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2660 1288" width="2660" height="1288" role="img" aria-label="Pipeline diagram: a camera source is sampled at 5fps, MediaPipe Face Detector crops the face, then splits into a FaceLandmarker plus GeometricRatioFeatureLayer path producing a 10-dim vector, and a frozen CNN path producing a 64-dim embedding. The two fuse into a 74-dim vector per frame, filling a 100-timestep zero-pre-padded sliding window that a Norm-LSTM-Dropout-Dense classifier reads, thresholding p(Drowsy) at 0.57 to output Not Drowsy or Drowsy, which feeds the alert pipeline.">
  <title>Fused CNN+LSTM drowsiness pipeline, MediaPipe stages included</title>
  <desc>src/cv-argus's deployed model architecture: MediaPipe Face Detector + FaceLandmarker feeding a frozen-CNN-embedding + geometric-feature fusion into an LSTM classifier over a rolling window, thresholded at p(Drowsy)=0.57. See src/cv-argus/CLAUDE.md's "fused detector" section for the source of truth.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"></path>
    </marker>
    <style>
      text{ font-family:'IBM Plex Sans',system-ui,sans-serif; fill:#17212B; }
      .mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; }
      .title{ font-weight:600; }
      .dim{ fill:#57697C; }
      .italic{ font-style:italic; }
      .safe-text{ fill:#2F8F6F; }
      .alert-text{ fill:#B23324; }
      .stage{ fill:#FFFFFF; stroke:#B9C4D0; stroke-width:2.5; }
      .fusehex{ fill:#E7EDF3; stroke:#2C6E8E; stroke-width:3; }
      .diamond{ fill:#E7EDF3; stroke:#2C6E8E; stroke-width:3; }
      .pill-safe{ fill:#FFFFFF; stroke:#2F8F6F; stroke-width:3; }
      .pill-alert{ fill:#FFFFFF; stroke:#B23324; stroke-width:3; }
      .cell-pad{ fill:none; stroke:#B9C4D0; stroke-width:1.8; stroke-dasharray:3,3; }
      .cell-real{ fill:#2C6E8E; }
      .arrow{ stroke:#57697C; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .arrow-dotted{ stroke:#57697C; stroke-width:2.5; fill:none; stroke-dasharray:6,5; marker-end:url(#arrow); }
      .arrowhead{ fill:#57697C; }
      .fork-dot{ fill:#2C6E8E; }
</style>
  </defs>

  <rect x="0" y="0" width="2660" height="1288" fill="#F4F7FA"/>

  <!-- ===== connectors ===== -->
  <path class="arrow" d="M 364.0,364.0 Q 511.0,324.8 658.0,364.0"/>
  <path class="arrow" d="M 1022.0,364.0 Q 1141.0,324.8 1260.0,364.0"/>
  <path class="arrow" d="M 1498.0,364.0 Q 1536.62,230.85 1652.0,154.0"/>
