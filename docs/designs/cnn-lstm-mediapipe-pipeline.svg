  <path class="arrow" d="M 1988.0,154.0 Q 2044.0,120.4 2100.0,154.0"/>
  <path class="arrow" d="M 2268.0,224.0 Q 2226.68,248.83 2243.5,294.0"/>
  <path class="arrow" d="M 1820.0,574.0 Q 2017.69,461.46 2243.5,434.0"/>
  <path class="arrow" d="M 2310.0,434.0 Q 2346.4,616.0 2310.0,798.0"/>
  <path class="arrow" d="M 2114.0,910.0 Q 2051.0,940.8 1988.0,910.0"/>
  <path class="arrow" d="M 1652.0,910.0 Q 1487.5,943.6 1323.0,910.0"/>
  <path class="arrow" d="M 1190.0,777.0 Q 981.56,689.12 756.0,672.0"/>
  <path class="arrow" d="M 1190.0,1043.0 Q 981.56,1130.88 756.0,1148.0"/>
