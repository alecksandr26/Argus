  <path class="arrow-dotted" d="M 588.0,1092.0 Q 565.6,1039.5 588.0,987.0"/>
  <circle class="fork-dot" cx="1498.0" cy="364.0" r="7.0"/>

  <!-- ===== boxes (drawn before text so fills sit under labels) ===== -->
  <rect class="stage" x="56.0" y="294.0" width="308.0" height="140.0" rx="16.8"/>
  <rect class="stage" x="658.0" y="294.0" width="364.0" height="140.0" rx="16.8"/>
  <rect class="stage" x="1260.0" y="301.0" width="238.0" height="126.0" rx="16.8"/>
