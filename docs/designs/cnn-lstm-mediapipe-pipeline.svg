  <rect class="cell-real" x="2466.8" y="890.4" width="19.6" height="30.8" rx="2.8"/>

  <!-- ===== labels ===== -->
  <text class="title" x="210.0" y="352.8" text-anchor="middle" font-size="18">Camera / video source</text>
  <text class="mono dim" x="210.0" y="380.8" text-anchor="middle" font-size="13.5">cv2.VideoCapture / PiCamera2</text>
  <text class="title" x="840.0" y="352.8" text-anchor="middle" font-size="18">MediaPipe Face Detector</text>
  <text class="mono dim" x="840.0" y="386.4" text-anchor="middle" font-size="13.5">BlazeFace &#183; VIDEO mode</text>
  <text class="title" x="1379.0" y="358.4" text-anchor="middle" font-size="18">Face crop (RGB)</text>
  <text class="italic dim" x="1379.0" y="389.2" text-anchor="middle" font-size="12.5">(fork point)</text>
  <text class="title" x="1820.0" y="140.0" text-anchor="middle" font-size="18">MediaPipe FaceLandmarker</text>
  <text class="mono dim" x="1820.0" y="170.8" text-anchor="middle" font-size="13.5">IMAGE mode, on the crop</text>
  <text class="title" x="2268.0" y="140.0" text-anchor="middle" font-size="16.5">GeometricRatioFeatureLayer</text>
  <text class="mono dim" x="2268.0" y="173.6" text-anchor="middle" font-size="13.5">EAR / MAR + blendshapes</text>
  <text class="title" x="1820.0" y="630.0" text-anchor="middle" font-size="18">Frozen CNN embedder</text>
  <text class="mono dim" x="1820.0" y="663.6" text-anchor="middle" font-size="13.5">07 checkpoint, features only</text>
  <text class="title" x="2310.0" y="351.4" text-anchor="middle" font-size="16">Fuse</text>
  <text class="dim" x="2310.0" y="379.4" text-anchor="middle" font-size="12.5">(concat)</text>
  <text class="title" x="2310.0" y="834.4" text-anchor="middle" font-size="18">Sliding window buffer</text>
  <text class="mono dim" x="2310.0" y="863.8" text-anchor="middle" font-size="13.5">100 &#215; 74 &#183; 20s @ 5fps window</text>
  <text class="mono dim" x="2310.0" y="971.6" text-anchor="middle" font-size="11.5">zero-pre-padded (oldest &#8594; out)</text>
  <text class="title" x="1820.0" y="876.4" text-anchor="middle" font-size="18">Fused LSTM classifier</text>
  <text class="mono dim" x="1820.0" y="908.6" text-anchor="middle" font-size="13.5">Norm &#8594; LSTM &#8594; Dropout &#8594; Dense</text>
  <text class="mono dim" x="1820.0" y="1016.4" text-anchor="middle" font-size="11.5">traced tf.function &#183; ~8&#8211;11 ms/frame</text>
  <text class="mono dim" x="1820.0" y="1037.4" text-anchor="middle" font-size="10.5">(recurrent_dropout=0.3, no cuDNN)</text>
  <text class="title" x="1190.0" y="884.8" text-anchor="middle" font-size="16">p(Drowsy)</text>
  <text class="title" x="1190.0" y="915.6" text-anchor="middle" font-size="16">&#8805; t* ?</text>
  <text class="mono dim" x="1190.0" y="943.6" text-anchor="middle" font-size="12.5">t* = 0.57</text>
  <text class="title safe-text" x="588.0" y="660.8" text-anchor="middle" font-size="18">Not Drowsy</text>
  <text class="mono dim" x="588.0" y="691.6" text-anchor="middle" font-size="12">level 1 &#183; not-drowsy</text>
  <text class="title alert-text" x="588.0" y="1136.8" text-anchor="middle" font-size="18">Drowsy</text>
  <text class="mono dim" x="588.0" y="1167.6" text-anchor="middle" font-size="12">level 2 &#183; drowsy</text>
  <text class="title" x="588.0" y="876.4" text-anchor="middle" font-size="18">Alert / status pipeline</text>
  <text class="mono dim" x="588.0" y="907.2" text-anchor="middle" font-size="13.5">SQLite buffer &#8594; Bluetooth &#8594; ESP32</text>
  <text class="italic dim" x="588.0" y="935.2" text-anchor="middle" font-size="11">(full flow: see semantic-design diagram)</text>
  <text class="mono dim" x="2044.0" y="33.6" text-anchor="middle" font-size="11.5">468 landmarks + blendshapes</text>
  <text class="mono dim" x="483.0" y="470.4" text-anchor="middle" font-size="13">sampled @ 5 fps</text>
  <text class="mono dim" x="483.0" y="495.6" text-anchor="middle" font-size="11.5">(SAMPLE_FPS, at the source)</text>
  <text class="mono dim" x="1141.0" y="470.4" text-anchor="middle" font-size="13">crop, margin 0.25</text>
  <text class="mono dim" x="1141.0" y="495.6" text-anchor="middle" font-size="13">BGR &#8594; RGB</text>
  <text class="italic dim" x="1502.8" y="206.0" text-anchor="middle" font-size="13">landmarks path</text>
  <text class="italic dim" x="1653.5" y="460.8" text-anchor="middle" font-size="13">embedding path</text>
  <text class="mono dim" x="2192.3" y="236.8" text-anchor="middle" font-size="11.5">10-dim vector</text>
  <text class="mono dim" x="2005.4" y="424.2" text-anchor="middle" font-size="11.5">64-dim embedding</text>
  <text class="mono dim" x="990.1" y="653.7" text-anchor="middle" font-size="13">p &lt; 0.57</text>
  <text class="mono dim" x="990.1" y="1166.3" text-anchor="middle" font-size="13">p &#8805; 0.57</text>
  <text class="mono dim" x="2338.0" y="590.8" text-anchor="start" font-size="11.5">74-dim fused vector</text>
  <text class="mono dim" x="2338.0" y="613.2" text-anchor="start" font-size="11.5">(1 row / sampled frame)</text>
  <text class="mono dim" x="2051.0" y="974.4" text-anchor="middle" font-size="11.5">window tensor</text>
  <text class="mono dim" x="2051.0" y="995.4" text-anchor="middle" font-size="11.5">(100&#215;74) + mask</text>
</svg>
