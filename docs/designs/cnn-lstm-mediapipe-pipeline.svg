  <!-- ===== labels ===== -->
  <text class="title" x="150.0" y="192.0" text-anchor="middle" font-size="18">Camera / video source</text>
  <text class="mono dim" x="150.0" y="212.0" text-anchor="middle" font-size="13.5">cv2.VideoCapture / PiCamera2</text>
  <text class="title" x="497.0" y="192.0" text-anchor="middle" font-size="18">MediaPipe Face Detector</text>
  <text class="mono dim" x="497.0" y="216.0" text-anchor="middle" font-size="13.5">BlazeFace &#183; VIDEO mode</text>
  <text class="title" x="807.5" y="196.0" text-anchor="middle" font-size="18">Face crop (RGB)</text>
  <text class="italic dim" x="807.5" y="218.0" text-anchor="middle" font-size="12.5">(fork point)</text>
  <text class="title" x="1163.0" y="62.0" text-anchor="middle" font-size="18">MediaPipe FaceLandmarker</text>
  <text class="mono dim" x="1163.0" y="84.0" text-anchor="middle" font-size="13.5">IMAGE mode, on the crop</text>
  <text class="title" x="1518.0" y="62.0" text-anchor="middle" font-size="16.5">GeometricRatioFeatureLayer</text>
  <text class="mono dim" x="1518.0" y="86.0" text-anchor="middle" font-size="13.5">EAR / MAR + blendshapes</text>
  <text class="title" x="1350.0" y="322.0" text-anchor="middle" font-size="18">Frozen CNN embedder</text>
  <text class="mono dim" x="1350.0" y="346.0" text-anchor="middle" font-size="13.5">07 checkpoint, features only</text>
  <text class="title" x="1830.0" y="191.0" text-anchor="middle" font-size="16">Fuse</text>
  <text class="dim" x="1830.0" y="211.0" text-anchor="middle" font-size="12.5">(concat)</text>
  <text class="title" x="1830.0" y="498.0" text-anchor="middle" font-size="18">Sliding window buffer</text>
  <text class="mono dim" x="1830.0" y="519.0" text-anchor="middle" font-size="13.5">100 &#215; 74 &#183; 20s @ 5fps window</text>
  <text class="mono dim" x="1830.0" y="576.0" text-anchor="middle" font-size="13">zero-pre-padded (oldest &#8594; out)</text>
  <text class="title" x="1490.0" y="496.0" text-anchor="middle" font-size="18">Fused LSTM classifier</text>
  <text class="mono dim" x="1490.0" y="519.0" text-anchor="middle" font-size="13.5">Norm &#8594; LSTM &#8594; Dropout &#8594; Dense</text>
  <text class="mono dim" x="1490.0" y="596.0" text-anchor="middle" font-size="13">traced tf.function &#183; ~8&#8211;11 ms/frame</text>
  <text class="mono dim" x="1490.0" y="613.0" text-anchor="middle" font-size="11.5">(recurrent_dropout=0.3, no cuDNN)</text>
  <text class="title" x="1090.0" y="502.0" text-anchor="middle" font-size="16">p(Drowsy)</text>
  <text class="title" x="1090.0" y="524.0" text-anchor="middle" font-size="16">&#8805; t* ?</text>
  <text class="mono dim" x="1090.0" y="545.0" text-anchor="middle" font-size="12.5">t* = 0.57</text>
  <text class="title safe-text" x="590.0" y="342.0" text-anchor="middle" font-size="18">Not Drowsy</text>
  <text class="mono dim" x="590.0" y="364.0" text-anchor="middle" font-size="12">level 1 &#183; not-drowsy</text>
  <text class="title alert-text" x="590.0" y="682.0" text-anchor="middle" font-size="18">Drowsy</text>
  <text class="mono dim" x="590.0" y="704.0" text-anchor="middle" font-size="12">level 2 &#183; drowsy</text>
  <text class="title" x="590.0" y="498.0" text-anchor="middle" font-size="18">Alert / status pipeline</text>
  <text class="mono dim" x="590.0" y="520.0" text-anchor="middle" font-size="13.5">SQLite buffer &#8594; Bluetooth &#8594; ESP32</text>
  <text class="italic dim" x="590.0" y="540.0" text-anchor="middle" font-size="11.5">(full flow: see semantic-design diagram)</text>
  <text class="mono dim" x="1340.0" y="18.0" text-anchor="middle" font-size="16">468 landmarks + blendshapes</text>
  <text class="mono dim" x="323.0" y="268.0" text-anchor="middle" font-size="16">sampled @ 5 fps</text>
  <text class="mono dim" x="323.0" y="288.0" text-anchor="middle" font-size="14">(SAMPLE_FPS, at the source)</text>
  <text class="mono dim" x="652.0" y="268.0" text-anchor="middle" font-size="16">crop, margin 0.25</text>
  <text class="mono dim" x="652.0" y="288.0" text-anchor="middle" font-size="16">BGR &#8594; RGB</text>
  <text class="italic dim" x="915.4" y="96.5" text-anchor="middle" font-size="16">landmarks path</text>
  <text class="italic dim" x="1085.0" y="208.3" text-anchor="middle" font-size="16">embedding path</text>
  <text class="mono dim" x="1644.3" y="167.5" text-anchor="middle" font-size="14">10-dim vector</text>
  <text class="mono dim" x="1560.3" y="208.3" text-anchor="middle" font-size="14">64-dim embedding</text>
  <text class="mono dim" x="901.8" y="340.3" text-anchor="middle" font-size="16">p &lt; 0.57</text>
  <text class="mono dim" x="901.8" y="699.7" text-anchor="middle" font-size="16">p &#8805; 0.57</text>
  <text class="mono dim" x="1886.0" y="341.0" text-anchor="start" font-size="14">74-dim fused vector</text>
  <text class="mono dim" x="1886.0" y="359.0" text-anchor="start" font-size="14">(1 row / sampled frame)</text>
  <text class="mono dim" x="1657.5" y="418.0" text-anchor="middle" font-size="14">window tensor</text>
  <text class="mono dim" x="1657.5" y="436.0" text-anchor="middle" font-size="14">(100&#215;74) + mask</text>
</svg>
