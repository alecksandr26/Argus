  <rect class="stage" x="266.0" y="833.0" width="644.0" height="154.0" rx="16.8"/>
  <rect class="cell-pad" x="2156.0" y="890.4" width="19.6" height="30.8"/>
  <rect class="cell-pad" x="2179.8" y="890.4" width="19.6" height="30.8"/>
