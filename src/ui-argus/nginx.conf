# SPA fallback: react-router owns client-side routes like /flota or /alertas/:id that
# don't exist as files in dist/ — without try_files falling back to index.html, a hard
# refresh or a shared deep link on any route but "/" 404s at the nginx layer.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
