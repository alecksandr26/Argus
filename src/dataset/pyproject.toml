# `argus_dataset` — the local (WSL2) re-implementation of Argus's dataset-creation stage.
#
# This is a standalone module: it depends only on MediaPipe + OpenCV + NumPy + pandas + tqdm
# (see requirements.txt). It deliberately does NOT depend on `tensorflow` or on the sibling
# `cv_argus` package — the geometric-ratio math the notebooks did with a `tf.keras` layer is
# reimplemented in plain NumPy in `argus_dataset/geometry.py` (validated against the real layer
# by `tests/test_geometry_equiv.py`), which also keeps ~0.5 GB of TensorFlow out of every
# spawned worker process.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-dataset"
version = "0.1.0"
description = "Local, pausable/resumable dataset-creation pipeline for Argus (ports of src/notebook 01/02/06/09)."
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.14,<0.11",
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
# Notebook 02's statistical-analysis cells (Spearman / Kruskal-Wallis / logistic-regression
# baseline). Only needed for `build_frame_features.py --analysis`; never for the artifacts.
analysis = ["scipy>=1.11", "scikit-learn>=1.4", "seaborn>=0.13", "matplotlib>=3.8"]
# `tests/test_geometry_equiv.py` cross-checks the NumPy port against the real tf.keras layer.
dev = ["pytest>=8", "tensorflow>=2.16,<2.17", "pyarrow>=15"]

[tool.setuptools]
packages = ["argus_dataset"]
