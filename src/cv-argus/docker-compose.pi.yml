# Raspberry Pi 5 deployment overlay — merge on top of the base compose file, don't run alone:
#
#   docker compose -f docker-compose.yml -f docker-compose.pi.yml up --build
#
# Compose merges list-valued keys (like `devices:` below) by *replacing* the base file's list,
# not appending to it — so this file lists the full Pi-specific device set, not just additions.
#
# The device list below was taken from a real Pi 5 (IMX219 CSI camera); picamera2/libcamera
# themselves come from Raspberry Pi's apt repo, installed by the Dockerfile on arm64.
# **One-time host step first**: `sudo scripts/pi-host-setup.sh` (see that script) -- this Pi runs
# rootless Docker, where the container can't use the host's `video` group, so libcamera's
# dma-heap allocator is denied unless the host grants the Docker user an ACL on /dev/dma_heap/*.
# Deliberately not `privileged: true` or a blanket `/dev` mount — the root `CLAUDE.md` calls for
# specific device passthrough, not `--privileged`, for the Pi's AI-orchestrator container.
services:
  cv-argus:
    # The base file's Pi-5 simulation defaults (cpuset 0-3, cpus 4, mem_limit 8g,
    # CV_ARGUS_NUM_THREADS 4, SAMPLE_FPS 5) are already correct for real Pi-5 hardware --
    # nothing to override here. On a 4-core / 8 GB board the limits are simply no-ops.
    environment:
      - SOURCE=picamera
    devices:
      # Verified against a real Pi 5 (Raspberry Pi OS / Debian 13, IMX219 CSI camera): this is
      # every node libcamera's Pi 5 (PiSP) pipeline handler opens. Compose has no globs, so a
      # device that doesn't exist on the host makes `up` fail outright -- if a different board,
      # camera or kernel numbers them differently, re-check with
      # `ls /dev/media* /dev/video* /dev/dma_heap/` and edit this list.
      # Media controller nodes -- libcamera enumerates cameras through these:
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1
      - /dev/media2:/dev/media2
      - /dev/media3:/dev/media3
      # RP1 CSI-2 front end (rp1-cfe) capture/metadata nodes:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
      - /dev/video4:/dev/video4
      - /dev/video5:/dev/video5
      - /dev/video6:/dev/video6
      - /dev/video7:/dev/video7
      # Sensor + CSI-2 receiver sub-devices -- without these libcamera skips the camera
      # ("Device node /dev/v4l-subdev2 can't be accessed"):
      - /dev/v4l-subdev0:/dev/v4l-subdev0
      - /dev/v4l-subdev1:/dev/v4l-subdev1
      - /dev/v4l-subdev2:/dev/v4l-subdev2
      # PiSP ISP backend nodes (raw -> processed RGB):
      - /dev/video19:/dev/video19
      - /dev/video20:/dev/video20
      - /dev/video21:/dev/video21
      - /dev/video22:/dev/video22
      - /dev/video23:/dev/video23
      - /dev/video24:/dev/video24
      - /dev/video25:/dev/video25
      - /dev/video26:/dev/video26
      - /dev/video27:/dev/video27
      - /dev/video28:/dev/video28
      - /dev/video29:/dev/video29
      - /dev/video30:/dev/video30
      - /dev/video31:/dev/video31
      - /dev/video32:/dev/video32
      - /dev/video33:/dev/video33
      - /dev/video34:/dev/video34
      - /dev/video35:/dev/video35
      # DMA heap allocators libcamera uses for zero-copy frame buffers:
      - /dev/dma_heap/default_cma_region:/dev/dma_heap/default_cma_region
      - /dev/dma_heap/linux,cma:/dev/dma_heap/linux,cma
      - /dev/dma_heap/system:/dev/dma_heap/system
    volumes:
      # libcamera's udev device enumerator reads udev's database to resolve which media/
      # sub-device nodes belong together; without it, it can't "acquire a CFE instance" and
      # lists zero cameras even with every device node passed through. Read-only.
      - /run/udev:/run/udev:ro
    # The Pi needs to come back up on its own after a power cycle in the truck; deliberately
    # left off the base/dev compose file so a laptop container doesn't restart forever while
    # iterating on it (see the root README's "Why a Docker-first workflow").
    restart: unless-stopped
    # No SENDER_TRANSPORT=bluetooth here: this rootless container can't open Bluetooth sockets
    # at all. The ESP32's server runs on the Pi host (scripts/pi_bt_server.py) against the
    # queue shared by docker-compose.bt.yml -- `scripts/demo.sh --camera picam --bluetooth`.
