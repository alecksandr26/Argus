# Dev loop: `docker compose up --build` builds for your machine's own architecture
# (amd64 on a laptop, arm64 on the Pi) and bind-mounts src/ (the cv_argus package — see
# setup.py) so code edits are picked up without rebuilding the image — the same image
# definition either machine uses.
#
# Cross-building an arm64 image *from* an amd64 dev machine (e.g. to push straight to the
# Pi without building on it) needs `docker buildx build --platform linux/arm64 ...`
# instead of plain `docker compose build`; compose alone only targets the host arch.
services:
  cv-argus:
    build:
      context: .
      # Model artifacts are baked in at build time now (see the Dockerfile) — compose reads
      # these from this directory's `.env` (the same file `env_file:` below loads for runtime)
      # to pass them through as build args. Both have checked-in defaults (see src/constants.py),
      # so `docker compose build` succeeds even with no `.env` at all.
      args:
        CNN_MODEL_DRIVE_FILE_ID: ${CNN_MODEL_DRIVE_FILE_ID:-}
        FUSED_MODEL_DRIVE_FILE_ID: ${FUSED_MODEL_DRIVE_FILE_ID:-}
    image: argus/cv-argus:dev
    env_file:
      - .env
    environment:
      - CAMERA_SOURCE=${CAMERA_SOURCE:-0}
      - SOURCE=${SOURCE:-video_capture}
      - OUTPUTS=${OUTPUTS:-logging}
      - DEMO_STREAM_HOST=${DEMO_STREAM_HOST:-0.0.0.0}
      - DEMO_STREAM_PORT=${DEMO_STREAM_PORT:-8080}
    # Only actually listened on when OUTPUTS includes "mjpeg" (see src/main.py,
    # pipeline/mjpeg_output_stage.py) — harmless to always publish otherwise, nothing binds the
    # container-side port if that output stage was never built. No authentication on that
    # stream once it's on: demo-only, don't leave OUTPUTS=...,mjpeg set in a real deployment.
    ports:
      - "${DEMO_STREAM_PORT:-8080}:8080"
    volumes:
      - ./src:/app/src
      - model-cache:/app/models
      - buffer-data:/app/data
    devices:
      # Adjust/remove if your machine's webcam isn't at /dev/video0, or if you're
      # testing against a video file via CAMERA_SOURCE instead of a real camera. The Pi's CSI
      # camera (SOURCE=picamera) needs different device passthrough entirely — see
      # docker-compose.pi.yml, not this file.
      - /dev/video0:/dev/video0

volumes:
  model-cache:
  # buffer/'s SQLite file (queued/unsent alerts) — see the BUFFER_DIR note in the Dockerfile.
  buffer-data:
