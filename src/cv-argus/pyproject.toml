# Without this file, `pip install -e .` (see Dockerfile) has no declared build backend and
# falls back to the legacy `setup.py develop` editable-install path. That legacy path adds only
# the project root (the directory setup.py lives in, /app in the image) to sys.path via an
# .egg-link/easy-install.pth -- it does NOT honor setup.py's `package_dir={"cv_argus": "src"}`
# remap, so Python looks for /app/cv_argus/__init__.py (which doesn't exist -- the code is at
# /app/src/__init__.py) and `import cv_argus` fails with ModuleNotFoundError even though `pip
# show cv_argus` reports it as installed. Declaring the setuptools backend here makes pip use
# the modern PEP 660 editable-wheel install instead, which builds a proper per-package finder
# that does respect package_dir -- keep this file even though setup.py still holds the actual
# package metadata/config.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# --- Test suite (see tests/ and tests/README-ish note in tests/conftest.py) ---------------
# The default `pytest` run is hermetic: no network, no camera, no Google Drive, no model
# download. Every downloader test either exercises the skip-if-cached path or monkeypatches
# `gdown` / `urllib`. The one non-hermetic tier is `-m docker` (builds and runs the image);
# it is deselected by default and additionally skips itself unless CV_ARGUS_DOCKER_TESTS=1.
[tool.pytest.ini_options]
testpaths = ["tests"]
# Deselect the docker tier from a plain `pytest`; run it explicitly with `-m docker`.
addopts = "-m 'not docker'"
markers = [
    "docker: builds/runs the Docker image end to end (opt-in: needs `docker` on PATH and CV_ARGUS_DOCKER_TESTS=1; slow, pulls ~1GB)",
]
filterwarnings = [
    # TensorFlow / protobuf / mediapipe drag in a long tail of DeprecationWarnings that aren't
    # this project's to fix; keep test output readable.
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
